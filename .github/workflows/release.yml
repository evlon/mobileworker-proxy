name: Release

# 打 tag 即发布：
#   git tag v0.1.0
#   git push origin v0.1.0
#
# tag 里带连字符（如 v0.2.0-rc1）会自动发布为 pre-release。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.tag }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME}"; fi
          case "$V" in
            v*) ;;
            *) V="v$V" ;;   # 忘了写 v 前缀也能用
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "版本号：$V"

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT="dist/mobilework-proxy-${VERSION}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$OUT" .
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: |
          set -euo pipefail
          ls -lh
          rm -f SHA256SUMS.txt
          # 用显式前缀，避免把 SHA256SUMS.txt 自己算进去；文件名也保持干净
          sha256sum mobilework-proxy-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，改为覆盖上传资产"
            gh release upload "$VERSION" dist/* --clobber
          else
            ARGS=(--title "$VERSION" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
            gh release create "$VERSION" dist/* "${ARGS[@]}"
          fi
          echo "发布完成：${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION"
